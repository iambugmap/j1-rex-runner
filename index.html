<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5EFE0" />
    <title>J1 Rex</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23F5EFE0'/%3E%3Cpath fill='%231F2A44' d='M4 1h4v3H6v1H5v2H4V6H2v1H1V5H0V3h1v1h1V3h2z'/%3E%3Crect x='5' y='2' width='1' height='1' fill='%23F5EFE0'/%3E%3C/svg%3E"
    />
    <!-- Official Telegram Mini App SDK. Must load before the app script; harmless outside Telegram. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1 class="title">J1 REX</h1>
        <button id="mute-btn" class="icon-btn" type="button" aria-label="Mute sound" aria-pressed="false">
          SOUND ON
        </button>
      </header>

      <div id="stage" class="stage">
        <canvas id="game" role="img" aria-label="J1 Rex runner game"></canvas>
      </div>

      <p id="hint" class="hint">SPACE / ↑ to jump · ↓ to duck</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
